<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abu Dhabi Client Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:14px}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.login-box{background:#fff;border-radius:12px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-box h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-box p{color:#666;font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.field input:focus{outline:none;border-color:#2563eb}
.field small{display:block;color:#999;font-size:11px;margin-top:4px}
.btn-login{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.btn-login:hover{background:#1d4ed8}
.login-error{color:#dc2626;font-size:13px;margin-top:12px;text-align:center;display:none}
#main-screen{display:none}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.topbar h1{font-size:17px;font-weight:700;white-space:nowrap}
.topbar h1 span{color:#2563eb}
.search-wrap{flex:1;max-width:320px}
.search-wrap input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.search-wrap input:focus{outline:none;border-color:#2563eb}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.count-badge{background:#f3f4f6;color:#374151;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-edit{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd}
.btn-edit:hover{background:#e0f2fe}
.btn-del{background:#fff5f5;color:#dc2626;border:1px solid #fecaca}
.btn-del:hover{background:#fee2e2}
.btn-ghost{background:transparent;color:#666;border:1px solid #ddd}
.btn-ghost:hover{background:#f9fafb}
.save-indicator{font-size:12px;color:#6b7280}
.save-indicator.saving{color:#2563eb}
.save-indicator.saved{color:#16a34a}
.save-indicator.error{color:#dc2626}
.tabs-wrap{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;overflow-x:auto}
.tabs{display:flex;gap:0;white-space:nowrap}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab:hover{color:#1a1a1a}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:600}
.tab-count{background:#f3f4f6;color:#6b7280;padding:2px 7px;border-radius:20px;font-size:11px;margin-left:5px}
.tab.active .tab-count{background:#dbeafe;color:#1d4ed8}
.table-wrap{padding:16px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
thead{background:#f8fafc}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
tr.new-entry td{background:#eff6ff}
tr.new-entry:hover td{background:#dbeafe}
.company-name{font-weight:600;color:#111}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.cat-Interior{background:#fef3c7;color:#92400e}
.cat-Design{background:#ede9fe;color:#5b21b6}
.cat-Consultants{background:#d1fae5;color:#065f46}
.cat-Hotels{background:#fee2e2;color:#991b1b}
.cat-Holding{background:#e0f2fe;color:#075985}
.cat-Royal{background:#fce7f3;color:#9d174d}
.cat-FFE{background:#f0fdf4;color:#166534}
.cat-Joinery{background:#fef9c3;color:#854d0e}
.website-link{color:#2563eb;text-decoration:none;font-size:12px}
.website-link:hover{text-decoration:underline}
.notes-cell{max-width:200px;color:#666;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;white-space:nowrap}
.cb-cell{text-align:center}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#2563eb}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.25)}
.modal-header{padding:20px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af;line-height:1;padding:4px}
.modal-close:hover{color:#374151}
.modal-body{padding:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:.4px}
.form-field input,.form-field select,.form-field textarea{padding:9px 11px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;font-family:inherit}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:#2563eb}
.form-field textarea{resize:vertical;min-height:70px}
.modal-footer{padding:16px 24px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Abu Dhabi Client Tracker</h1>
    <p>Enter your credentials to continue</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Password">
    </div>
    <div class="field">
      <label>GitHub Token</label>
      <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <small>Required to save edits. Leave blank for read-only.</small>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password.</div>
  </div>
</div>

<div id="main-screen">
  <div class="topbar">
    <h1>Abu Dhabi <span>Client Tracker</span></h1>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search companies, contacts, notes…" oninput="renderTable()">
    </div>
    <div class="topbar-right">
      <span class="save-indicator" id="save-indicator"></span>
      <span class="count-badge" id="count-badge">0 companies</span>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Company</button>
    </div>
  </div>
  <div class="tabs-wrap"><div class="tabs" id="tab-bar"></div></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Company</th><th>Category</th><th>Website</th>
          <th>Email</th><th>Phone</th><th>Officer</th><th>Notes</th>
          <th title="Physical Meeting 1">PM1</th><th title="Call 1">C1</th>
          <th title="Call 2">C2</th><th title="Call 3">C3</th>
          <th title="Physical Meeting 2">PM2</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add Company</h2>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full">
          <label>Company Name *</label>
          <input type="text" id="f-name" placeholder="e.g. RMJM Abu Dhabi">
        </div>
        <div class="form-field">
          <label>Category *</label>
          <select id="f-category">
            <option>Interior Companies</option><option>Design Companies</option>
            <option>Consultants</option><option>Hotels</option>
            <option>Holding Companies</option><option>Royal HH Offices</option>
            <option>FF&amp;E Buying Companies</option><option>Joinery Companies</option>
          </select>
        </div>
        <div class="form-field">
          <label>Website</label>
          <input type="text" id="f-website" placeholder="https://...">
        </div>
        <div class="form-field">
          <label>Procurement Email</label>
          <input type="email" id="f-email" placeholder="procurement@company.com">
        </div>
        <div class="form-field">
          <label>Office Phone</label>
          <input type="text" id="f-phone" placeholder="+971 2 ...">
        </div>
        <div class="form-field">
          <label>Procurement Officer</label>
          <input type="text" id="f-officer" placeholder="Full name">
        </div>
        <div class="form-field">
          <label>Address</label>
          <input type="text" id="f-address" placeholder="Abu Dhabi">
        </div>
        <div class="form-field full">
          <label>Notes</label>
          <textarea id="f-notes" placeholder="Any relevant notes…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCompany()">Save</button>
    </div>
  </div>
</div>

<script>
const REPO_OWNER='omg9401', REPO_NAME='ad-tracker', DATA_FILE='companies.json';
const PW_HASH='am9teWtvY2hlcnkxQA==';
const CATS=['Interior Companies','Design Companies','Consultants','Hotels','Holding Companies','Royal HH Offices','FF&E Buying Companies','Joinery Companies'];
const CAT_CLS={'Interior Companies':'cat-Interior','Design Companies':'cat-Design','Consultants':'cat-Consultants','Hotels':'cat-Hotels','Holding Companies':'cat-Holding','Royal HH Offices':'cat-Royal','FF&E Buying Companies':'cat-FFE','Joinery Companies':'cat-Joinery'};

let companies=[], activeTab='All', editId=null, ghToken='', fileSha='', saveTimer=null;
const today=new Date().toISOString().slice(0,10);

document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('gh-token-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function doLogin(){
  if(btoa(document.getElementById('pw-input').value)!==PW_HASH){
    document.getElementById('login-error').style.display='block'; return;
  }
  ghToken=document.getElementById('gh-token-input').value.trim();
  sessionStorage.setItem('auth','1');
  if(ghToken)sessionStorage.setItem('ght',ghToken);
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  loadData();
}

if(sessionStorage.getItem('auth')==='1'){
  ghToken=sessionStorage.getItem('ght')||'';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  loadData();
}

async function loadData(){
  try{
    const h={'Accept':'application/vnd.github.v3+json'};
    if(ghToken)h['Authorization']='token '+ghToken;
    const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`,{headers:h});
    if(r.ok){const m=await r.json();fileSha=m.sha;companies=JSON.parse(atob(m.content.replace(/\n/g,'')));renderAll();return;}
  }catch(e){}
  try{
    const r=await fetch('./'+DATA_FILE+'?t='+Date.now());
    if(r.ok){companies=await r.json();renderAll();}
  }catch(e){console.error('Load failed',e);}
}

async function saveToGitHub(msg='Update companies'){
  if(!ghToken){showSave('Read-only (no token)','error');return;}
  showSave('Saving…','saving');
  try{
    const h={'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'};
    if(!fileSha){const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`,{headers:h});if(r.ok){const m=await r.json();fileSha=m.sha;}}
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(companies,null,2))));
    const body={message:msg,content};if(fileSha)body.sha=fileSha;
    const res=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE}`,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){const d=await res.json();fileSha=d.content.sha;showSave('Saved ✓','saved');}
    else throw new Error(await res.text());
  }catch(e){console.error(e);showSave('Save failed','error');}
}

function showSave(msg,state){
  const el=document.getElementById('save-indicator');
  el.textContent=msg;el.className='save-indicator '+(state||'');
  if(state==='saved')setTimeout(()=>{el.textContent='';el.className='save-indicator';},3000);
}
function scheduleSave(msg){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveToGitHub(msg),1200);}

function renderAll(){renderTabs();renderTable();}

function renderTabs(){
  const bar=document.getElementById('tab-bar');
  bar.innerHTML=['All',...CATS].map(t=>{
    const n=t==='All'?companies.length:companies.filter(c=>c.category===t).length;
    return `<div class="tab${activeTab===t?' active':''}" onclick="setTab(${JSON.stringify(t)})">${t}<span class="tab-count">${n}</span></div>`;
  }).join('');
}

function setTab(t){activeTab=t;renderAll();}

function renderTable(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const rows=companies.filter(c=>{
    if(activeTab!=='All'&&c.category!==activeTab)return false;
    if(!q)return true;
    return[c.name,c.category,c.procurement_email,c.office_phone,c.procurement_officer,c.notes,c.website].some(v=>(v||'').toLowerCase().includes(q));
  });
  document.getElementById('count-badge').textContent=rows.length+' compan'+(rows.length===1?'y':'ies');
  if(!rows.length){document.getElementById('table-body').innerHTML='<tr><td colspan="14" style="text-align:center;padding:60px;color:#9ca3af">No companies found</td></tr>';return;}
  document.getElementById('table-body').innerHTML=rows.map((c,i)=>{
    const isNew=c.added_date===today;
    const ws=c.website?`<a class="website-link" href="${esc(c.website)}" target="_blank">&#8599; Visit</a>`:'';
    return `<tr class="${isNew?'new-entry':''}" data-id="${c.id}">
      <td style="color:#9ca3af;font-size:12px">${i+1}</td>
      <td><div class="company-name">${esc(c.name)}</div></td>
      <td><span class="cat-badge ${CAT_CLS[c.category]||''}">${esc(c.category)}</span></td>
      <td>${ws}</td>
      <td style="font-size:12px">${esc(c.procurement_email||'')}</td>
      <td style="font-size:12px;white-space:nowrap">${esc(c.office_phone||'')}</td>
      <td style="font-size:12px">${esc(c.procurement_officer||'')}</td>
      <td class="notes-cell" title="${esc(c.notes||'')}">${esc(c.notes||'')}</td>
      ${['physical_meeting_1','call_1','call_2','call_3','physical_meeting_2'].map(f=>`<td class="cb-cell"><input type="checkbox" ${c[f]?'checked':''} onchange="toggleField(${c.id},'${f}',this.checked)"></td>`).join('')}
      <td class="actions"><button class="btn btn-sm btn-edit" onclick="openModal(${c.id})">Edit</button><button class="btn btn-sm btn-del" onclick="deleteCompany(${c.id})">Del</button></td>
    </tr>`;
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toggleField(id,field,val){
  const c=companies.find(x=>x.id===id);if(!c)return;
  c[field]=val;scheduleSave('Update interaction for '+c.name);
}

function openModal(id){
  editId=id||null;
  document.getElementById('modal-title').textContent=editId?'Edit Company':'Add Company';
  if(editId){
    const c=companies.find(x=>x.id===editId);if(!c)return;
    document.getElementById('f-name').value=c.name||'';
    document.getElementById('f-category').value=c.category||'Interior Companies';
    document.getElementById('f-website').value=c.website||'';
    document.getElementById('f-email').value=c.procurement_email||'';
    document.getElementById('f-phone').value=c.office_phone||'';
    document.getElementById('f-officer').value=c.procurement_officer||'';
    document.getElementById('f-address').value=c.address||'';
    document.getElementById('f-notes').value=c.notes||'';
  }else{
    ['f-name','f-website','f-email','f-phone','f-officer','f-address','f-notes'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('f-category').value=activeTab!=='All'?activeTab:'Interior Companies';
  }
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function saveCompany(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('Company name is required.');return;}
  if(editId){
    Object.assign(companies.find(x=>x.id===editId),getForm(name));
    saveToGitHub('Edit '+name);
  }else{
    const maxId=companies.reduce((m,c)=>Math.max(m,c.id),0);
    companies.unshift({id:maxId+1,...getForm(name),physical_meeting_1:false,call_1:false,call_2:false,call_3:false,physical_meeting_2:false,added_date:today});
    saveToGitHub('Add '+name);
  }
  closeModal();renderAll();
}

function getForm(name){
  return{name,category:document.getElementById('f-category').value,website:document.getElementById('f-website').value.trim(),procurement_email:document.getElementById('f-email').value.trim(),office_phone:document.getElementById('f-phone').value.trim(),procurement_officer:document.getElementById('f-officer').value.trim(),address:document.getElementById('f-address').value.trim(),notes:document.getElementById('f-notes').value.trim()};
}

function deleteCompany(id){
  const c=companies.find(x=>x.id===id);if(!c)return;
  if(!confirm('Delete "'+c.name+'"?'))return;
  companies=companies.filter(x=>x.id!==id);
  saveToGitHub('Delete '+c.name);renderAll();
}

function exportCSV(){
  const cols=['id','name','category','website','address','procurement_email','office_phone','procurement_officer','notes','physical_meeting_1','call_1','call_2','call_3','physical_meeting_2','added_date'];
  const rows=[cols.join(',')];
  companies.forEach(c=>rows.push(cols.map(k=>`"${String(c[k]||'').replace(/"/g,'""')}"`).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='abu-dhabi-tracker-'+today+'.csv';a.click();
}
</script>
</body>
</html>
